# This workflow will install Python dependencies, run crawl/enhancement, and deploy to GitHub Pages
name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Crawl, Enhance, and Commit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync
        
    - name: Fetch historical data from data branch
      run: |
        echo "과거 논문 데이터 가져오는 중... / Fetching historical paper data from data branch..."
        mkdir -p data assets
        if git ls-remote --heads origin data | grep -q data; then
          git fetch origin data:data_history || true
          git checkout data_history -- data/ assets/file-list.txt 2>/dev/null || true
          git reset HEAD data/ assets/file-list.txt 2>/dev/null || true
          echo "✅ 과거 데이터 로드 완료 / Successfully loaded historical data"
        else
          echo "ℹ️ data 브랜치가 아직 없습니다 / data branch does not exist yet"
        fi

    - name: Crawl arXiv papers
      id: crawl_step
      run: |
        source .venv/bin/activate
        today=$(date -u "+%Y-%m-%d")
        echo "오늘($today)의 arXiv 논문 크롤링 시작... / Starting to crawl $today arXiv papers..."
        
        # 오늘 날짜의 기존 파일이 있으면 삭제 후 새로 생성 / Check if today's file exists, delete if found
        if [ -f "data/${today}.jsonl" ]; then
            echo "🗑️ 오늘 파일이 이미 존재합니다. 삭제 후 다시 생성합니다... / Found existing today's file, deleting for fresh start..."
            rm "data/${today}.jsonl"
            echo "✅ 기존 파일 삭제 완료: data/${today}.jsonl / Deleted existing file: data/${today}.jsonl"
        else
            echo "📝 오늘 파일이 없습니다. 새로 생성 준비... / Today's file doesn't exist, ready to create new one..."
        fi
        
        cd daily_arxiv
        export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        export OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}"
        export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        export TOKEN_GITHUB="${{ secrets.TOKEN_GITHUB }}"
        export LANGUAGE="${{ vars.LANGUAGE }}"
        export LANGUAGE="${LANGUAGE:-Korean}"
        export CATEGORIES="${{ vars.CATEGORIES }}"
        export CATEGORIES="${CATEGORIES:-de novo design}"
        export MODEL_NAME="${{ vars.MODEL_NAME }}"
        export MODEL_NAME="${MODEL_NAME:-gemini-3.7-flash}"
        
        # Scrapy로 크롤링 실행 / Use Scrapy to crawl
        scrapy crawl arxiv -o ../data/${today}.jsonl
        
        # 크롤링 성공 여부 확인 / Check if crawling was successful
        if [ ! -f "../data/${today}.jsonl" ]; then
            echo "크롤링 실패: 데이터 파일이 생성되지 않았습니다 / Crawling failed, no data file generated"
            exit 1
        fi
        
        echo "crawl_date=$today" >> $GITHUB_OUTPUT
        echo "크롤링 완료 / Crawling completed"
        
    - name: Check for duplicates
      id: dedup_check
      run: |
        source .venv/bin/activate
        echo "중복 검사 실행 중... / Performing intelligent deduplication check..."
        
        cd daily_arxiv
        # 중복 검사 스크립트 실행 / Execute intelligent deduplication check script
        set +e  # 일시적으로 오류 종료 비활성화 / Temporarily allow command failure
        python daily_arxiv/check_stats.py
        
        # 종료 코드 획득 / Get exit code
        dedup_exit_code=$?
        set -e  # 엄격 모드 복원 / Restore strict mode
        
        echo "중복 검사 종료 코드: $dedup_exit_code / Dedup check exit code: $dedup_exit_code"
        echo "dedup_exit_code=$dedup_exit_code" >> $GITHUB_OUTPUT
        
        case $dedup_exit_code in
            0)
                echo "has_new_content=true" >> $GITHUB_OUTPUT
                ;;
            1)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=no_new_content" >> $GITHUB_OUTPUT
                ;;
            2)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=processing_error" >> $GITHUB_OUTPUT
                exit 1
                ;;
            *)
                echo "❌ 알 수 없는 종료 코드, 워크플로우를 중단합니다 / Unknown exit code, stop workflow"
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=unknown_error" >> $GITHUB_OUTPUT
                exit 1
                ;;
        esac
        
    - name: AI Enhancement Processing
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        echo "AI 강화 처리 시작... / Starting AI enhancement processing..."
        
        cd ai
        export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
        export OPENAI_BASE_URL="${{ secrets.OPENAI_BASE_URL }}"
        export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        export LANGUAGE="${{ vars.LANGUAGE }}"
        export LANGUAGE="${LANGUAGE:-Korean}"
        export MODEL_NAME="${{ vars.MODEL_NAME }}"
        export MODEL_NAME="${MODEL_NAME:-gemini-3.7-flash}"
        
        python enhance.py --data ../data/${today}.jsonl
        
        # AI 처리 성공 여부 확인 / Check if AI processing was successful
        if [ $? -ne 0 ]; then
            echo "AI 처리 실패 / AI processing failed"
            exit 1
        fi
        echo "AI 강화 처리 완료 / AI enhancement processing completed"
        
    - name: Convert to Markdown
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        echo "Markdown 형식으로 변환 중... / Converting to Markdown format..."
        
        # 환경 변수 설정 / Set environment variables
        export LANGUAGE="${{ vars.LANGUAGE }}"
        export LANGUAGE="${LANGUAGE:-Korean}"
        
        cd to_md
        
        # AI 강화 파일로 변환 실행 / Use AI enhanced file for conversion
        AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"
        
        if [ -f "$AI_FILE" ]; then
            echo "AI 강화 파일로 변환 실행... / Using AI enhanced file for conversion..."
            python convert.py --data "$AI_FILE"
        else
            echo "오류: AI 강화 파일을 찾을 수 없습니다 / Error: AI enhanced file not found"
            echo "AI 파일: $AI_FILE"
            exit 1
        fi
        
        # 변환 성공 여부 확인 / Check if conversion was successful
        if [ $? -ne 0 ]; then
            echo "Markdown 변환 실패 / Markdown conversion failed"
            exit 1
        fi
        echo "Markdown 변환 완료 / Markdown conversion completed"
        
    - name: Update file list
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "파일 목록 업데이트 중... / Updating file list..."
        ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
        echo "파일 목록 업데이트 완료 / File list updated"

    - name: Generate password hash and inject into config
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "🔐 인증용 비밀번호 해시 생성 중... / Generating password hash for authentication..."

        PASSWORD="${{ secrets.ACCESS_PASSWORD }}"

        if [ -z "$PASSWORD" ]; then
          echo "⚠️  WARNING: ACCESS_PASSWORD not set in Secrets"
          echo "⚠️  Password protection will be DISABLED"
          echo "⚠️  To enable password protection, add ACCESS_PASSWORD in repository Secrets"
          echo "ℹ️  Website will remain publicly accessible without authentication"

          PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
        else
          PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          echo "✅ 비밀번호 해시 생성 완료 / Password hash generated successfully"
          echo "🔐 비밀번호 보호가 활성화되었습니다 / Password protection is ENABLED"
        fi

        # web/js/auth-config.js에 해시 주입
        if [ -f "web/js/auth-config.js" ]; then
          sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" web/js/auth-config.js
          echo "✅ 비밀번호 해시 주입 완료 (web/js/auth-config.js)"
        else
          echo "❌ ERROR: web/js/auth-config.js not found!"
          exit 1
        fi

        echo "🔐 인증 설정 완료 / Authentication setup complete"

    - name: Summary
      run: |
        if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
          echo "✅ 워크플로우 완료: 새 논문이 발견되어 성공적으로 처리되었습니다 / Workflow completed: Found new content and processed successfully"
        else
          case "${{ steps.dedup_check.outputs.skip_reason }}" in
            "no_new_content")
              echo "ℹ️ 워크플로우 완료: 중복 검사 결과 새로운 내용이 없습니다 / Workflow completed: No new content after smart deduplication"
              ;;
            "processing_error")
              echo "⚠️ 워크플로우 완료: 중복 검사 처리 중 오류 발생 / Workflow completed: Deduplication processing error"
              ;;
            "unknown_error")
              echo "⚠️ 워크플로우 완료: 알 수 없는 오류 / Workflow completed: Unknown error"
              ;;
            *)
              echo "ℹ️ 워크플로우 완료: 알 수 없는 이유로 건너뜀 / Workflow completed: Skipped for unknown reason"
              ;;
          esac
        fi
        
    - name: Inject repository info into data-config.js
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "저장소 정보 주입 중... / Injecting repository info into data-config.js..."
        
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        echo "저장소 소유자: $REPO_OWNER / Repository owner: $REPO_OWNER"
        echo "저장소 이름: $REPO_NAME / Repository name: $REPO_NAME"
        
        if [ -f "web/js/data-config.js" ]; then
          sed -i "s/repoOwner: .*/repoOwner: '$REPO_OWNER',/g" web/js/data-config.js
          sed -i "s/repoName: .*/repoName: '$REPO_NAME',/g" web/js/data-config.js
          echo "✅ 저장소 정보 주입 완료 (web/js/data-config.js) / Repository info injected into web/js/data-config.js"
        else
          echo "❌ ERROR: web/js/data-config.js not found!"
          exit 1
        fi

    - name: Commit code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"
        
        git add web/js/data-config.js
        git add .github/
        git add -A
        git reset -- data/* assets/file-list.txt 2>/dev/null || true
        
        if git diff --staged --quiet; then
          echo "커밋할 코드 변경 사항이 없습니다 / No code changes to commit"
        else
          git commit -m "chore: update data-config.js with repository info"
          echo "코드 변경 사항을 main 브랜치에 커밋했습니다 / Code changes committed to main branch"
        fi

    - name: Push code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config pull.rebase true
        git config rebase.autoStash true
        
        for i in {1..3}; do
          echo "코드 변경 사항 푸시 시도 $i / Push code changes attempt $i"
          if git push origin main; then
            echo "코드 변경 푸시 성공 / Code changes pushed successfully"
            break
          else
            echo "푸시 실패, 최신 변경 사항 가져오는 중... / Push failed, pulling latest changes..."
            git pull origin main --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3회 시도 후 푸시 실패 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done

    - name: Prepare data files for data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "데이터 파일 준비 중... / Preparing data files..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        mkdir -p /tmp/data_files/data
        mkdir -p /tmp/data_files/assets
        
        cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
        cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true
        
        echo "데이터 파일 임시 디렉토리에 저장 완료 / Data files saved to temporary directory"

    - name: Setup and commit to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"
        
        echo "data 브랜치 설정 중... / Setting up data branch..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        rm -rf data/*.jsonl 2>/dev/null || true
        rm -f data/*.md 2>/dev/null || true
        rm -f assets/file-list.txt 2>/dev/null || true
        
        if git ls-remote --heads origin data | grep -q data; then
          echo "data 브랜치가 이미 존재합니다. data 브랜치로 전환합니다 / Data branch exists, switching to data branch"
          git fetch origin data:data
          git checkout data
          git pull origin data || true
        else
          echo "data 브랜치가 없습니다. 새 브랜치를 생성합니다 / Data branch does not exist, creating new branch"
          git checkout --orphan data
          git rm -rf --cached . 2>/dev/null || true
          mkdir -p data assets
          echo "# Data Branch" > README.md
          git add README.md
          git commit -m "chore: initialize data branch"
          git push origin data
        fi
        
        mkdir -p data assets
        cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
        # ponytail: regenerate from merged data/ so history accumulates; single-day copy truncates file-list
        ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
        
        git add data/* 2>/dev/null || true
        git add assets/file-list.txt 2>/dev/null || true
        
        if git diff --staged --quiet; then
          echo "커밋할 데이터 변경 사항이 없습니다 / No data changes to commit"
        else
          git commit -m "update: $today arXiv papers"
          echo "데이터 변경 사항을 data 브랜치에 커밋했습니다 / Data changes committed to data branch"
        fi

    - name: Push data changes to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config pull.rebase true
        git config rebase.autoStash true
        
        for i in {1..3}; do
          echo "데이터 변경 사항 푸시 시도 $i / Push data changes attempt $i"
          if git push origin data; then
            echo "데이터 변경 푸시 성공 / Data changes pushed successfully"
            break
          else
            echo "푸시 실패, 최신 변경 사항 가져오는 중... / Push failed, pulling latest changes..."
            git pull origin data --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3회 시도 후 푸시 실패 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject repository info into data-config.js
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -f "web/js/data-config.js" ]; then
            sed -i "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" web/js/data-config.js
            sed -i "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" web/js/data-config.js
            echo "✅ 저장소 정보 주입 완료 (web/js/data-config.js)"
          fi

      - name: Inject password hash into auth-config.js
        run: |
          PASSWORD="${{ secrets.ACCESS_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          else
            PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          fi
          if [ -f "web/js/auth-config.js" ]; then
            sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" web/js/auth-config.js
            echo "✅ 비밀번호 해시 주입 완료 (web/js/auth-config.js)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
