name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject repository info into data-config.js
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -f "web/js/data-config.js" ]; then
            sed -i "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" web/js/data-config.js
            sed -i "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" web/js/data-config.js
            echo "✅ 저장소 정보 주입 완료 (web/js/data-config.js)"
          fi

      - name: Inject password hash into auth-config.js
        run: |
          PASSWORD="${{ secrets.ACCESS_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          else
            PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          fi
          if [ -f "web/js/auth-config.js" ]; then
            sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" web/js/auth-config.js
            echo "✅ 비밀번호 해시 주입 완료 (web/js/auth-config.js)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
